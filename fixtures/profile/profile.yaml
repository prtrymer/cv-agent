summary:
  master: >-
    Full Stack Engineer with 3.5 years shipping production web products in TypeScript, React and Node.js (NestJS)
    on PostgreSQL — most recently a multi-market grocery marketplace, and before that a loyalty rewards game built
    from scratch and delivered through a partner loyalty platform to live users. I own features end to end, from data
    model and API through UI, tests and CI/CD, and I am the engineer who joins an existing production codebase, learns
    the domain and starts shipping inside it. Backed by Java/Spring, Elixir and a regulated-sector track record. Daily
    development with AI coding agents (Claude Code, Codex) under test-and-review guardrails.

