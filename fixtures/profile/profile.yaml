      - id: retail.shared-ui
        text: "Other squads build on the shared UI components — extend and maintain them with backwards-compatible changes, so work done for one surface never breaks another."
        tags: [react, design-system]
      - id: retail.openai
        text: "An internal operations tool needed LLM capabilities — integrated the OpenAI API into it."
        tags: [ai, llm, integration]

  - id: rewards
    group: agency
    company: Questify
    titles: [Full Stack Engineer, Backend Engineer, Frontend Engineer]
    tagline: TypeScript / React / NestJS
    keywords: [rewards game, loyalty, gamification, verifiable draw]
    start: 2025-05
    end: 2026-04
    context: >-
      Year-long engagement with full-stack ownership across backend services and the web client. Headline deliverable:
      a loyalty rewards game built from the ground up and delivered through a partner loyalty platform into a live
      retail app.
    stack: [TypeScript, Node.js, NestJS, React, Next.js, Angular, RxJS, Angular Material, Zustand, TanStack Query,
            TanStack Table, React Hook Form, Zod, Redux, RTK, React Native, WebSocket, Redis, PostgreSQL, TypeORM,
            Tailwind, styled-components, shadcn/ui, SCSS, Vite, Webpack, Jest, GitHub Actions, hexagonal architecture,
            event bus, dependency injection, DDD, CQRS, JWT, RBAC, CSRF, XSS, Mailgun, AWS, AWS S3, AWS Lambda, AWS EKS,
            Kubernetes, Terraform, GCP, GCP Cloud Storage, GCP Compute Engine, GCP Cloud Functions, SSR, SSG, ISR, SEO,
            Storyblok, Vercel, Docker, Figma, Swagger, Postman, payment integrations]
    bullets:
      - id: rw.game
        text: "A retailer needed a rewards game its users could reach through a loyalty layer — built it from scratch and integrated it into a partner loyalty platform and on into a live retail app, working on both ends of that chain."
        tags: [fullstack, gaming, integration]
      - id: rw.multi-open
        text: "The client let users claim only one reward per action — implemented multi-claiming so a user can open several in a single action."
        tags: [frontend, gaming]
      - id: rw.verifiable
        text: "Prize draws had to be verifiable — implemented verification that hands the user the server secret and timestamp after each draw, so the random number behind their prize can be recomputed independently."
        tags: [backend, regulated, gaming]
      - id: rw.atomic-reveal
        text: "Multi-claiming put several reveals in flight at once — handled secret disclosure inside atomic transactions, so each secret was revealed exactly once and stayed consistent under concurrent claims and retries."
        tags: [backend, concurrency, postgres]
      - id: rw.hexagonal
        text: "The game had to evolve without touching its business rules — structured it on hexagonal architecture with an event bus between modules, keeping domain logic behind ports."
        tags: [architecture, backend, event-driven]
      - id: rw.email-assets
        text: "New users needed transactional email and the game needed durable storage for its imagery — integrated Mailgun behind its own adapter and built an AWS S3 asset module wired into the same event bus."
        tags: [backend, aws, integration]
      - id: rw.security-incident
        text: "A stolen API token and a logic flaw allowed multiple wins on a single reward — diagnosed the production incident, fixed the root cause and hardened JWT token handling alongside CSRF protection and XSS input sanitization."
        tags: [security, incident, frontend, backend]
      - id: rw.realtime
        text: "Clients had to poll for state changes — delivered real-time updates over WebSocket, including a live notifications and events feed, pushing changes to connected clients instead."
        tags: [realtime, websocket, fullstack]
      - id: rw.redis
        text: "Hot-path reads were landing on the primary database — used Redis for caching and cross-instance shared state to keep them off it."
        tags: [backend, performance, redis]
      - id: rw.nest-di
        text: "The domain layer had to be testable without standing up infrastructure — built NestJS backend services around dependency injection, so domain logic stayed unit-testable in isolation."
        tags: [backend, nestjs, testing]
      - id: rw.data-layer
        text: "Server data needed one predictable home in the web client — owned the frontend data layer with TanStack Query and Zustand."
        tags: [frontend, react, state]
      - id: rw.forms-tables
        text: "Data-heavy screens needed dependable forms and tables — built them with React Hook Form, Zod validation and TanStack Table."
        tags: [frontend, react, forms]
      - id: rw.styling
        text: "The styling layer carried a mixed history — maintained a consistent component API across Tailwind, styled-components and SCSS."
        tags: [frontend, css]
      - id: rw.pipeline
        text: "Every pull request needed gating before review — maintained the build and test pipeline end to end, from Vite and Webpack configuration to Jest suites and GitHub Actions workflows."
        tags: [ci-cd, testing, tooling]
      - id: rw.admin-panel
        text: "The game needed a back office — built an Angular admin panel with RxJS and Angular Material over TypeORM and PostgreSQL, backed by GCP Compute Engine VMs, Cloud Functions and Cloud Storage."
        tags: [angular, frontend, gcp]
      - id: rw.ddd-postgres
        text: "Backend logic and query load grew with the product — applied DDD/CQRS patterns on the NestJS backend and optimized PostgreSQL with partitioned tables and EXPLAIN-driven query analysis."
        tags: [backend, postgres, architecture, performance]
      - id: rw.infra
        text: "Infrastructure had to be reproducible — worked on Terraform-managed AWS infrastructure with AWS Lambda functions and workloads on AWS EKS (Kubernetes)."
        tags: [devops, aws, kubernetes]
      - id: rw.nextjs-seo
        text: "Public pages needed to rank and load fast — built them with Next.js using SSR, SSG and ISR plus technical SEO, with content from Storyblok CMS and deployment on Vercel."
        tags: [frontend, nextjs, seo]

