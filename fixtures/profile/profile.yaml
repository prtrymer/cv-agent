      - id: retail.react19
        text: "A major version upgrade has to land without pausing a live, high-traffic product — contribute to the migration to React 19, working through its breaking changes across a large shared frontend in continuous production use."
        tags: [react, migration]
      - id: retail.css-modules
        text: "The previous styling approach is being retired as part of that migration — rewrite the styling layer into CSS Modules component by component while holding visual parity in the live product."
